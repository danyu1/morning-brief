name: Rebuild site from daily agent data
on:
  schedule:
    - cron: '20 15 * * 1-5'   # weekdays 8:20 AM PT — catches fast agent runs
    - cron: '20 16 * * 1-5'   # weekdays 9:20 AM PT — catches slow agent runs
  workflow_dispatch:
permissions:
  contents: write
env:
  DRIVE_FOLDER: 1IppAd0yN8fevDySo-Ju7RCbjyCCPOxEv
jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch newest agent blob from Drive
        run: |
          set -e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          ok=""
          if [ -n "${DRIVE_API_KEY}" ]; then
            curl -sf "https://www.googleapis.com/drive/v3/files?q=%27${DRIVE_FOLDER}%27+in+parents&fields=files(id,name)&key=${DRIVE_API_KEY}" -o list.json && ok=api || true
          fi
          if [ -z "$ok" ]; then
            for i in 1 2 3 4; do
              curl -sL -A "$UA" "https://drive.google.com/embeddedfolderview?id=${DRIVE_FOLDER}#list" -o folder.html || true
              if grep -q "flip-entry" folder.html; then ok=scrape; break; fi
              echo "listing attempt $i got blocked; retrying in $((i*15))s"
              sleep $((i*15))
            done
          fi
          [ -n "$ok" ] || { echo "::error::Drive folder listing unreachable from runner (all retries blocked)"; head -c 300 folder.html || true; exit 1; }
          python3 - "$ok" <<'PY'
          import re, sys, json
          mode = sys.argv[1]
          if mode == "api":
              files = json.load(open("list.json")).get("files", [])
              blobs = sorted((f["name"], f["id"]) for f in files
                             if re.fullmatch(r"agentdata-\d{8}\.enc", f["name"]))
          else:
              html = open("folder.html").read()
              entries = re.findall(r'entry-([\w-]{20,})".*?flip-entry-title">([^<]+)<', html, re.S)
              blobs = sorted((n, f) for f, n in entries
                             if re.fullmatch(r"agentdata-\d{8}\.enc", n))
          assert blobs, "no agentdata blobs found in Drive folder"
          print("newest blob:", blobs[-1][0])
          open("blob_id.txt", "w").write(blobs[-1][1])
          PY
          for i in 1 2 3; do
            curl -sL -A "$UA" "https://drive.google.com/uc?export=download&id=$(cat blob_id.txt)" -o agentdata.enc.b64
            grep -q "U2FsdGVk" agentdata.enc.b64 && break || sleep $((i*10))
          done
          grep -q "U2FsdGVk" agentdata.enc.b64

      - name: Rebuild encrypted site
        run: |
          set -e
          base64 -d agentdata.enc.b64 > agentdata.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SITE_PASSWORD -in agentdata.enc -out agentdata.json
          python3 -c "import json; json.load(open('agentdata.json'))"
          npm i --no-fund --no-audit staticrypt@3
          npx staticrypt index.html -p "$SITE_PASSWORD" --decrypt -d plain
          grep -q 'id="agentData"' plain/index.html
          python3 - <<'PY'
          import re
          shell = open('plain/index.html').read()
          data = open('agentdata.json').read().strip()
          new, n = re.subn(
              r'(<script id="agentData" type="application/json">).*?(</script>)',
              lambda m: m.group(1) + data + m.group(2), shell, count=1, flags=re.S)
          assert n == 1, "agentData slot not found"
          open('plain/index.html', 'w').write(new)
          PY
          npx staticrypt plain/index.html -p "$SITE_PASSWORD" -d built --remember 30 \
            --template-title "Morning Brief" --template-instructions "Enter the dashboard password"
          ! grep -q 'id="agentData"' built/index.html
          python3 - <<'PY'
          import re
          shell = open('plain/index.html').read()
          w = open('built/index.html').read()
          m = re.search(r'<link rel="icon" type="image/svg\+xml" href="data:image/svg\+xml,[^"]*">', shell)
          if m and '</title>' in w:
              w = w.replace('</title>', '</title>' + m.group(0), 1)
              open('built/index.html', 'w').write(w)
          PY
          mv built/index.html index.html
          rm -rf plain built agentdata* blob_id.txt folder.html list.json node_modules package.json package-lock.json
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - name: Commit if changed
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Site rebuild $(date -u +%F)" && git push)
