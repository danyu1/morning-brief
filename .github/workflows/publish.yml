name: Rebuild site from daily agent data
on:
  schedule:
    - cron: '25 15-20 * * 1-5'   # weekdays hourly 8:25 AM – 1:25 PM PT
  workflow_dispatch:
permissions:
  contents: write
env:
  DRIVE_FOLDER: 1IppAd0yN8fevDySo-Ju7RCbjyCCPOxEv
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch newest agent blob from Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          set -e
          pip -q install google-auth requests >/dev/null
          python3 - <<'PY'
          import os, json, re, requests
          from google.oauth2 import service_account
          import google.auth.transport.requests as gtr
          folder = os.environ['DRIVE_FOLDER']
          info = json.loads(os.environ['GDRIVE_SA_KEY'])
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=['https://www.googleapis.com/auth/drive.readonly'])
          creds.refresh(gtr.Request())
          h = {'Authorization': 'Bearer ' + creds.token}
          r = requests.get('https://www.googleapis.com/drive/v3/files',
                           params={'q': f"'{folder}' in parents and trashed=false",
                                   'fields': 'files(id,name)', 'pageSize': '1000'},
                           headers=h, timeout=30)
          r.raise_for_status()
          files = r.json().get('files', [])
          pat = re.compile(r'agentdata-(\d{8})(?:-(\d{4}))?\.enc')
          blobs = []
          for f in files:
              m = pat.fullmatch(f['name'])
              if m:
                  blobs.append(((m.group(1), m.group(2) or '0000'), f['name'], f['id']))
          blobs.sort()
          assert blobs, (f"no agentdata blobs visible to the service account "
                         f"(saw {len(files)} files) — is the folder shared with the SA email?")
          key, name, fid = blobs[-1]
          print('newest blob:', name)
          d = requests.get(f'https://www.googleapis.com/drive/v3/files/{fid}',
                           params={'alt': 'media'}, headers=h, timeout=30)
          d.raise_for_status()
          open('agentdata.enc.b64', 'wb').write(d.content)
          PY
          grep -q "U2FsdGVk" agentdata.enc.b64

      - name: Rebuild encrypted site
        run: |
          set -e
          base64 -d agentdata.enc.b64 > agentdata.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SITE_PASSWORD -in agentdata.enc -out agentdata.json
          python3 -c "import json; json.load(open('agentdata.json'))"
          npm i --no-fund --no-audit staticrypt@3
          npx staticrypt index.html -p "$SITE_PASSWORD" --decrypt -d plain
          grep -q 'id="agentData"' plain/index.html
          python3 - <<'PY'
          import re
          shell = open('plain/index.html').read()
          data = open('agentdata.json').read().strip()
          new, n = re.subn(
              r'(<script id="agentData" type="application/json">).*?(</script>)',
              lambda m: m.group(1) + data + m.group(2), shell, count=1, flags=re.S)
          assert n == 1, "agentData slot not found"
          open('plain/index.html', 'w').write(new)
          PY
          npx staticrypt plain/index.html -p "$SITE_PASSWORD" -d built --remember 30 \
            --template-title "Morning Brief" --template-instructions "Enter the dashboard password"
          ! grep -q 'id="agentData"' built/index.html
          python3 - <<'PY'
          import re
          shell = open('plain/index.html').read()
          w = open('built/index.html').read()
          m = re.search(r'<link rel="icon" type="image/svg\+xml" href="data:image/svg\+xml,[^"]*">', shell)
          if m and '</title>' in w:
              w = w.replace('</title>', '</title>' + m.group(0), 1)
              open('built/index.html', 'w').write(w)
          PY
          mv built/index.html index.html
          rm -rf plain built agentdata* node_modules package.json package-lock.json
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - name: Commit if changed
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Site rebuild $(date -u +%F)" && git push)
